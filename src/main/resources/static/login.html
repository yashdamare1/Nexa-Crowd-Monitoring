
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexa | Secure Login</title>
    <link rel="stylesheet" href="/css/style.css">
    <script src="/js/login.js" defer></script>
</head>
<body class="login-page">
    <main class="login-card">
        <div class="brand-mark">N</div>
        <p class="eyebrow">NEXA MONITORING PLATFORM</p>
        <h1>Welcome back</h1>
        <p class="muted">Sign in to access your monitoring dashboard.</p>

        <form id="loginForm">
            <label for="email">Email address</label>
            <input id="email" name="email" type="email"
                   placeholder="admin@example.com" required autocomplete="username">

            <label for="password">Password</label>
            <input id="password" name="password" type="password"
                   placeholder="Enter your password" required autocomplete="current-password">

            <button id="loginButton" type="submit">Sign in</button>
            <p id="loginError" class="error-message" role="alert"></p>
        </form>

        <p class="footer-note">Authorized personnel only</p>
    </main>
</body>
</html>
